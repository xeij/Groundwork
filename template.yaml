AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Groundwork — document intelligence for leases and financial filings, with citation-grounded findings

Parameters:
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Description: Anthropic API key for Claude
  AllowedOrigins:
    Type: String
    Default: "*"
    Description: Comma-separated list of allowed CORS origins (set to your Amplify URL in production)
  SecUserAgent:
    Type: String
    Default: "Groundwork/1.0 (support@example.com)"
    Description: >-
      User-Agent sent to SEC EDGAR. Must contain an email address: www.sec.gov returns 403
      without one, which breaks filing downloads. EDGAR does not verify the address, but the
      SEC's access policy expects a genuine one so they can contact you rather than block
      you — replace this placeholder with your own.

Globals:
  Function:
    Runtime: python3.12
    # An EDGAR-sourced analysis fans out across six category calls, two year-over-year
    # section diffs, and a dozen peer XBRL fetches. Must stay above the sum of the
    # per-stage Claude budgets in filing_analysis.py, and below the frontend's poll
    # window in useDocumentAnalysis.ts.
    Timeout: 600
    # 12 peer companyfacts payloads at ~4MB each, plus filing text for two years.
    MemorySize: 2048
    Environment:
      Variables:
        S3_BUCKET_NAME: !Ref LeasePdfBucket
        DYNAMODB_TABLE_NAME: !Ref SummariesTable
        ANTHROPIC_API_KEY: !Ref AnthropicApiKey
        CLAUDE_MODEL: claude-sonnet-4-6
        ALLOWED_ORIGINS: !Ref AllowedOrigins
        SEC_USER_AGENT: !Ref SecUserAgent

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Split [",", !Ref AllowedOrigins]
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.main.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref LeasePdfBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref SummariesTable
        - Statement:
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-ApiFunction-*"
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
            ApiId: !Ref HttpApi

  LeasePdfBucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - Status: Enabled
            ExpirationInDays: 1
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - "*"
            AllowedMethods:
              - PUT
            AllowedHeaders:
              - "*"
            MaxAge: 3000

  SummariesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: summaryId
          AttributeType: S
      KeySchema:
        - AttributeName: summaryId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL — set this as VITE_API_URL in Amplify
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  BucketName:
    Description: S3 bucket for temporary PDF staging
    Value: !Ref LeasePdfBucket
  TableName:
    Description: DynamoDB summaries table
    Value: !Ref SummariesTable
